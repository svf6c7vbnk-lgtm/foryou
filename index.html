<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Start Screen -->
  <div id="startScreen">
    <button id="clickMe">Click Me ❤️</button>
  </div>

  <!-- Main Content -->
  <div id="content" class="hidden">

    <img
      src="https://i.imgur.com/sF1Aj6y.jpeg"
      alt="Our memory"
      class="main-image"
    >

    <h1>I Love U ❤️</h1>

    <h2 class="monthsary">
      Happy 11 Monthsary ❤️
    </h2>

  </div>

  <!-- Music -->
  <audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <!-- Floating Effects -->
  <div id="effects"></div>

  <script src="script.js"></script>

</body>
</html>
